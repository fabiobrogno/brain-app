name: Release-Prüfung

# Build, Tests und App-Paket. Signiert + notarisiert wird nur bei Stable-Tags vX.Y.Z (Secrets, siehe docs/ENTWICKLUNG.md).
# v*-beta.N -> GitHub-Prerelease mit Zip (unsigniert); vX.Y.Z -> Release-Entwurf (draft) mit Zip, DMG und appcast.xml.
# workflow_dispatch prüft nur und veröffentlicht nichts. Tags werden nie ersetzt (docs/ENTWICKLUNG.md).
on:
  workflow_dispatch:
    inputs:
      signier_probe:
        description: 'Signier-Weg als Trockenlauf prüfen (--trocken, braucht die Secrets, veröffentlicht nichts)'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: release-pruefung-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paket:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain anzeigen
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | tr -s '\n ' '-')" >> "$GITHUB_OUTPUT"
      - name: SwiftPM-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-
      - name: Build
        timeout-minutes: 15
        run: swift build
      - name: Test
        timeout-minutes: 20
        run: swift test
      - name: App bauen (Node mit Prüfsumme)
        timeout-minutes: 15
        run: bash scripts/baue-app.sh
      # Signieren + Notarisieren nur für Stable-Tags vX.Y.Z; Betas bleiben ad-hoc signiert.
      # workflow_dispatch mit signier_probe=true macht denselben Weg als Trockenlauf (--trocken, nichts wird signiert).
      - name: Signier-Modus bestimmen
        id: modus
        env:
          PROBE: ${{ inputs.signier_probe }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "signieren=ja" >> "$GITHUB_OUTPUT"; echo "trocken=" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PROBE" == "true" ]]; then
            echo "signieren=ja" >> "$GITHUB_OUTPUT"; echo "trocken=--trocken" >> "$GITHUB_OUTPUT"
          else
            echo "signieren=nein" >> "$GITHUB_OUTPUT"
            echo "Kein Stable-Tag: App bleibt unsigniert."
          fi
      - name: Tag gegen App-Version prüfen
        if: steps.modus.outputs.signieren == 'ja' && steps.modus.outputs.trocken == ''
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Kortex.app/Contents/Info.plist)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Der Tag $GITHUB_REF_NAME passt nicht zur App-Version v$VERSION (Ressourcen/Info.plist, CFBundleShortVersionString). Veröffentlichung abgebrochen: Der Appcast würde auf eine nicht vorhandene Download-Adresse zeigen. Entweder die Version in der Info.plist anpassen oder einen passenden Tag setzen (Tags werden nie ersetzt, also neuen Tag vergeben)."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME passt zur App-Version."
      - name: Secrets prüfen
        if: steps.modus.outputs.signieren == 'ja'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          BRAIN_SIGNIER_ID: ${{ secrets.BRAIN_SIGNIER_ID }}
          NOTAR_KEY_P8_BASE64: ${{ secrets.NOTAR_KEY_P8_BASE64 }}
          NOTAR_KEY_ID: ${{ secrets.NOTAR_KEY_ID }}
          NOTAR_ISSUER_ID: ${{ secrets.NOTAR_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set +x
          fehlt=0
          for n in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD BRAIN_SIGNIER_ID NOTAR_KEY_P8_BASE64 NOTAR_KEY_ID NOTAR_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!n}" ]; then echo "::error::Das GitHub-Secret $n fehlt. Veröffentlichung abgebrochen, es wird nichts unsigniert ausgeliefert (docs/ENTWICKLUNG.md)."; fehlt=1; fi
          done
          exit "$fehlt"
      - name: Sparkle-Werkzeuge holen
        timeout-minutes: 5
        if: steps.modus.outputs.signieren == 'ja'
        run: |
          set -euo pipefail
          V=2.10.0
          SHA=c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
          D="$RUNNER_TEMP/sparkle"; mkdir -p "$D"
          curl -fsSL -o "$D/s.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$V/Sparkle-$V.tar.xz"
          echo "$SHA  $D/s.tar.xz" | shasum -a 256 -c -
          tar -xf "$D/s.tar.xz" -C "$D" ./bin
          echo "SPARKLE_BIN=$D/bin" >> "$GITHUB_ENV"
      - name: Schlüsselbund anlegen und Zertifikat importieren
        timeout-minutes: 5
        if: steps.modus.outputs.signieren == 'ja'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          KC="$RUNNER_TEMP/brain-signieren.keychain-db"
          KC_PW="$(uuidgen)"
          echo "::add-mask::$KC_PW"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          echo "BRAIN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Signieren + notarisieren + DMG + Appcast
        timeout-minutes: 30
        if: steps.modus.outputs.signieren == 'ja'
        env:
          BRAIN_SIGNIER_ID: ${{ secrets.BRAIN_SIGNIER_ID }}
          NOTAR_KEY_P8_BASE64: ${{ secrets.NOTAR_KEY_P8_BASE64 }}
          BRAIN_NOTAR_KEY_ID: ${{ secrets.NOTAR_KEY_ID }}
          BRAIN_NOTAR_ISSUER: ${{ secrets.NOTAR_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          BRAIN_GITHUB_REPO: ${{ github.repository }}
          TROCKEN: ${{ steps.modus.outputs.trocken }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          printf '%s' "$NOTAR_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notar.p8"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          export BRAIN_NOTAR_KEY_PFAD="$RUNNER_TEMP/notar.p8"
          export SPARKLE_ED_KEY_DATEI="$RUNNER_TEMP/sparkle.key"
          # shellcheck disable=SC2086
          bash scripts/veroeffentlichen.sh $TROCKEN --app build/Kortex.app
      - name: Schlüssel und Schlüsselbund löschen
        timeout-minutes: 5
        if: always() && steps.modus.outputs.signieren == 'ja'
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notar.p8" "$RUNNER_TEMP/sparkle.key"
          if [ -n "${BRAIN_KEYCHAIN:-}" ]; then
            security delete-keychain "$BRAIN_KEYCHAIN" || true
            security list-keychains -d user -s login.keychain-db || true
          fi
      # Prüfung nach der Notarisierung, unabhängig vom Signierskript (das prüft in seinem letzten Schritt selbst): so, wie Gatekeeper beim Nutzer urteilt.
      # Läuft nicht im Trockenlauf (da ist nichts signiert). Ein Fehler hier bricht ab, bevor irgendetwas hochgeladen wird.
      - name: Gatekeeper-Prüfung (spctl, stapler) an App und DMG
        if: steps.modus.outputs.signieren == 'ja' && steps.modus.outputs.trocken == ''
        timeout-minutes: 10
        run: |
          set -euo pipefail
          APP=build/Kortex.app
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          DMG="build/Kortex-$VERSION.dmg"
          [ -f "$DMG" ] || { echo "::error::$DMG fehlt."; exit 1; }
          echo "== App"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vv -t exec "$APP"
          xcrun stapler validate "$APP"
          echo "== DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          xcrun stapler validate "$DMG"
          echo "== App in der DMG, wie sie der Nutzer bekommt"
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -noverify -mountpoint "$MNT" "$DMG" >/dev/null
          trap 'hdiutil detach "$MNT" -force >/dev/null 2>&1 || true' EXIT
          [ -L "$MNT/Programme" ] || { echo "::error::In der DMG fehlt die Verknüpfung „Programme“."; exit 1; }
          spctl -a -vv -t exec "$MNT/Kortex.app"
          xcrun stapler validate "$MNT/Kortex.app"
          codesign -d --verbose=2 "$MNT/Kortex.app" 2>&1 | grep -E 'flags=.*runtime' >/dev/null || { echo "::error::Hardened Runtime fehlt an der App."; exit 1; }
          echo "Gatekeeper akzeptiert App und DMG, Notar-Beleg ist geheftet."
      - name: Appcast gegen Tag und DMG prüfen
        if: steps.modus.outputs.signieren == 'ja' && steps.modus.outputs.trocken == ''
        timeout-minutes: 5
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APPCAST=build/appcast.xml
          xmllint --noout "$APPCAST"
          grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" "$APPCAST" || { echo "::error::Version $VERSION fehlt im Appcast."; exit 1; }
          grep -q "enclosure url=\"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Kortex-$VERSION.dmg\"" "$APPCAST" || { echo "::error::Download-Adresse im Appcast passt nicht zu Tag und DMG."; exit 1; }
          grep -q 'sparkle:edSignature="' "$APPCAST" || { echo "::error::Die EdDSA-Signatur fehlt im Appcast."; exit 1; }
          echo "Appcast passt zu $GITHUB_REF_NAME."
      - name: Zippen
        timeout-minutes: 5
        run: |
          NAME="${GITHUB_REF_TYPE}-${GITHUB_REF_NAME//\//-}"
          ditto -c -k --keepParent build/Kortex.app "Kortex-${NAME}.zip"
          shasum -a 256 "Kortex-${NAME}.zip" | tee "Kortex-${NAME}.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Kortex-paket
          path: |
            Kortex-*.zip
            Kortex-*.zip.sha256
            build/Kortex-*.dmg
            build/appcast.xml
          retention-days: 14
          if-no-files-found: error

  veroeffentlichen:
    # Nur für Tags; ein Tag, der weder -beta.N noch X.Y.Z ist, bleibt bei Build und Tests.
    if: github.ref_type == 'tag'
    needs: paket
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Kortex-paket
      - name: Release anlegen
        timeout-minutes: 5
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            ART=(--prerelease)
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ART=(--draft)
          else
            echo "Tag $TAG ist weder vX.Y.Z noch vX.Y.Z-beta.N — kein Release."
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG existiert schon; Tags werden nie ersetzt." >&2
            exit 1
          fi
          EXTRA=()
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Stable: ohne signierte DMG und Appcast kein Release (nichts unsigniert ausliefern)
            ls build/Kortex-*.dmg build/appcast.xml >/dev/null
            EXTRA=(build/Kortex-*.dmg build/appcast.xml)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --generate-notes "${ART[@]}" Kortex-*.zip Kortex-*.zip.sha256 "${EXTRA[@]}"
      - name: Dateien des Releases prüfen
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Nur Tags, aus denen "Release anlegen" wirklich ein Release gemacht hat
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "Tag $TAG ist kein Release-Tag, nichts zu prüfen."; exit 0; }
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then ERWARTET=(appcast.xml); else ERWARTET=(); fi
          NAMEN="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$NAMEN"
          for n in "${ERWARTET[@]}"; do echo "$NAMEN" | grep -qx "$n" || { echo "::error::$n fehlt im Release $TAG."; exit 1; }; done
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "$NAMEN" | grep -Eq '^Kortex-[0-9.]+\.dmg$' || { echo "::error::Die DMG fehlt im Release $TAG."; exit 1; }; fi
          echo "$NAMEN" | grep -Eq '\.zip$' || { echo "::error::Das Zip fehlt im Release $TAG."; exit 1; }
