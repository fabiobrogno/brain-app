# TEMPORÄR (Paket fix/windows-rest): schnelle Windows-Läufe einzelner Tests/Proben. Wird vor „ready“ entfernt.
name: diag-windows
on:
  push:
    paths: ['.diag/**']
    branches: [fix/windows-rest]
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: bash .diag/lauf.sh 2>&1 | tail -n 700
