name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    # macos-26 (Apple Silicon) ist als GitHub-Runner verfügbar; die App braucht macOS 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift-Tests
        run: swift test

      - name: Node-Tests
        run: |
          if [ -f scripts/teste-node.sh ]; then
            bash scripts/teste-node.sh
          else
            echo "scripts/teste-node.sh existiert (noch) nicht, übersprungen."
          fi

      # Bewusst kein Signieren, Notarisieren oder Veröffentlichen in CI: Die Schlüssel liegen nur auf Fabios Mac.
