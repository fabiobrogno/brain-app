name: CI

# Nur PR und main: macOS-Minuten sind in privaten Repos teuer. Reine Doku löst keinen Lauf aus.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts/*.sh
        run: shellcheck -S warning scripts/*.sh

  # Platzhalter für die Node-Tests aus studio-v2 (FBL-25): läuft nur, wenn scripts/teste-node.sh existiert.
  # Fehlt das Skript, endet der Job grün ohne Arbeit; mit dem Skript ist er sofort aktiv.
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: teste-node.sh vorhanden?
        id: erkennen
        run: |
          if [ -f scripts/teste-node.sh ]; then echo "vorhanden=true" >> "$GITHUB_OUTPUT"; else echo "scripts/teste-node.sh fehlt — Node-Tests übersprungen."; fi
      - uses: actions/setup-node@v4
        if: steps.erkennen.outputs.vorhanden == 'true'
        with:
          node-version: '22'
      - name: Node-Tests
        if: steps.erkennen.outputs.vorhanden == 'true'
        run: bash scripts/teste-node.sh

  # Kern (Ressourcen/kern, aus dem ehemaligen Kit): Unit- und Shell-Tests aus Tests/Kern. Node wie im App-Bundle
  # (scripts/node-version.txt). Die Tests legen echte Git-Repos in Temp-Ordnern an; der Runner hat keine Git-Identität.
  kern-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: scripts/node-version.txt
      - name: shellcheck Tests/Kern (eigene Skripte)
        run: shellcheck -S warning Tests/Kern/stage.sh Tests/Kern/run-all.sh Tests/Kern/unit.sh
      - name: Kern-Tests
        run: bash Tests/Kern/run-all.sh
        env:
          GIT_AUTHOR_NAME: Test
          GIT_AUTHOR_EMAIL: t@example.org
          GIT_COMMITTER_NAME: Test
          GIT_COMMITTER_EMAIL: t@example.org

  # Playwright-Oberflächentests (Editor/Studio) gegen den Node-Entwicklungsserver; läuft ohne macOS.
  ui-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Tests/Oberflaeche
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tests/Oberflaeche/package-lock.json
      - name: Abhängigkeiten
        run: npm ci
      - name: Playwright-Version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Browser-Cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium installieren
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Systembibliotheken (Browser aus Cache)
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Oberflächentests
        run: npx playwright test --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
          # Die Werkstatt committet im Test echt; der Runner hat keine Git-Identität.
          GIT_AUTHOR_NAME: Test
          GIT_AUTHOR_EMAIL: t@example.org
          GIT_COMMITTER_NAME: Test
          GIT_COMMITTER_EMAIL: t@example.org
      - name: Bericht und Traces hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-bericht
          path: |
            Tests/Oberflaeche/playwright-report
            Tests/Oberflaeche/test-results
          retention-days: 14
          if-no-files-found: ignore

  build-test:
    # Package.swift verlangt swift-tools 6.2 und macOS 26 -> macos-26-Image (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain anzeigen
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | tr -s '\n ' '-')" >> "$GITHUB_OUTPUT"
      - name: SwiftPM-Cache
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      # Kern-Manifest (SHA-256 je Datei im Bundle) und Vorschau-Modus (Wegwerf-Ordner, Schutz vor echtem Benutzerordner).
      - name: Kern-Manifest
        run: bash scripts/teste-kern-manifest.sh
      - name: Vorschau-Modus
        run: bash scripts/teste-vorschau.sh

  # Spur „dev“: jeder Stand von main als Kortex.app (ad-hoc signiert), 14 Tage abrufbar.
  dev-artefakt:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [shellcheck, build-test]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain anzeigen
        id: toolchain
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | tr -s '\n ' '-')" >> "$GITHUB_OUTPUT"
      - name: SwiftPM-Cache
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-
      - name: App bauen (Node mit Prüfsumme)
        run: bash scripts/baue-app.sh
      - name: Zippen
        run: ditto -c -k --keepParent build/Kortex.app "Kortex-dev-${GITHUB_SHA::7}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Kortex-dev-${{ github.sha }}
          path: Kortex-dev-*.zip
          retention-days: 14
          if-no-files-found: error
