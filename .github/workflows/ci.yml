name: CI

# Ziel: jede Validierung in wenigen Minuten, Fehler früh sichtbar.
#  - aenderungen   entscheidet aus den geänderten Dateien, welche Bereiche laufen (scripts/ci-aenderungen.sh, getestet mit
#                  scripts/teste-ci-aenderungen.sh). Unbekannte Pfade schalten alles ein; nur Doku schaltet nichts ein.
#  - vorpruefung   shellcheck, Syntax, JSON, Lint (Linux, unter einer Minute) — fällt als Erstes rot auf.
#  - kern-test     Kern-Tests in 6 Shards (Gewichte: Tests/Kern/gewichte.txt), alle parallel.
#  - ui-test       Playwright in 6 Shards mit je 2 Workern, nur Chromium (Headless-Shell), Browser-Cache.
#  - node-test     Node-Tests (Tests/Node).
#  - swift         macOS (knapp, daher nur 1 Job): Build + Tests + Kern-Manifest + Vorschau.
#  - plattform-probe  Windows und Linux (Paket W0): Linux ist Tor (in ci-ok), Windows: Node-Tests sind Tor, Kern und Oberfläche nur Messung.
#  - electron-probe  Electron-Hülle (Paket W2a): Linux ist Tor (in ci-ok), Windows nur Messung (blockiert nichts).
#  - paket         Installierbare Pakete der Electron-Hülle (Paket W2c): baut, installiert und startet sie (Rauchtest), lädt sie als ARTEFAKT hoch (nie als Release).
#                  Läuft nur bei Änderungen an electron/ oder Ressourcen/. Linux und Windows sind Tor (in ci-ok).
#  - ci-ok         EIN Status für alles: grün, wenn jeder nötige Job grün war oder bewusst übersprungen wurde.
#  - dev-artefakt  nur auf main: Kortex.app als Artefakt.
# Es gibt absichtlich KEIN paths-ignore: Ein Lauf, der nur Doku ändert, ist in Sekunden grün (aenderungen + ci-ok), und der
# Status ci-ok fehlt nie (wichtig, falls er einmal als erforderlicher Check eingetragen wird).
on:
  pull_request:
  push:
    branches: [main]

# Neuer Push auf dieselbe PR-Branch bricht den alten Lauf ab; auf main läuft jeder Stand zu Ende.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  aenderungen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      kern: ${{ steps.filter.outputs.kern }}
      node: ${{ steps.filter.outputs.node }}
      ui: ${{ steps.filter.outputs.ui }}
      vorab: ${{ steps.filter.outputs.vorab }}
      paket: ${{ steps.filter.outputs.paket }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Geänderte Bereiche bestimmen
        id: filter
        env:
          EREIGNIS: ${{ github.event_name }}
          VORHER: ${{ github.event.before }}
        run: |
          # PR: ausgecheckt ist der Merge-Commit, sein erster Elternteil ist der aktuelle Stand des Zielzweigs.
          # Push auf main: Vergleich mit dem Stand vor dem Push. Ist der Vergleich nicht möglich, läuft alles.
          if [ "$EREIGNIS" = "pull_request" ]; then von=HEAD^1; else von="$VORHER"; fi
          echo "Vergleich: ${von:-?} .. HEAD"
          bash scripts/ci-aenderungen.sh "${von:-?}" HEAD | tee -a "$GITHUB_OUTPUT"

  vorpruefung:
    needs: aenderungen
    if: needs.aenderungen.outputs.vorab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: scripts/node-version.txt
      - name: shellcheck, Syntax, JSON, Lint
        run: bash scripts/ci-vorpruefung.sh
      - name: Pfadfilter selbst testen
        run: bash scripts/teste-ci-aenderungen.sh

  # Kern (Ressourcen/kern): Unit- und Shell-Tests aus Tests/Kern, in Shards. Node wie im App-Bundle (scripts/node-version.txt).
  kern-test:
    needs: aenderungen
    if: needs.aenderungen.outputs.kern == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: kern-test (${{ matrix.shard }}/6)
    env:
      # Die Tests legen echte Repos in Temp-Ordnern an und committen; der Runner hat keine Git-Identität.
      GIT_AUTHOR_NAME: Test
      GIT_AUTHOR_EMAIL: t@example.org
      GIT_COMMITTER_NAME: Test
      GIT_COMMITTER_EMAIL: t@example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: scripts/node-version.txt
      - name: Kern-Tests (Shard ${{ matrix.shard }} von 6)
        run: bash Tests/Kern/run-all.sh --shard ${{ matrix.shard }}/6
        env:
          KERN_TEST_KONKURRENZ: 4

  # Node-Tests (Brain Studio: Werkstatt, gemeinsam, MCP).
  node-test:
    needs: aenderungen
    if: needs.aenderungen.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Symbol-Paket (nur Prüfung von symbole.js)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: Werkzeuge/symbole
      - name: Node-Tests
        run: bash scripts/teste-node.sh --test-concurrency=4

  # Playwright-Oberflächentests (Editor/Studio) gegen den Node-Entwicklungsserver; läuft ohne macOS.
  # Jeder Test startet seinen eigenen Server auf freiem Port mit eigenem Temp-Vault -> Tests sind unabhängig und laufen
  # dateiübergreifend und innerhalb einer Datei parallel (--fully-parallel).
  ui-test:
    needs: aenderungen
    if: needs.aenderungen.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: ui-test (${{ matrix.shard }}/6)
    env:
      # Die Werkstatt committet im Test echt; der Runner hat keine Git-Identität.
      GIT_AUTHOR_NAME: Test
      GIT_AUTHOR_EMAIL: t@example.org
      GIT_COMMITTER_NAME: Test
      GIT_COMMITTER_EMAIL: t@example.org
    defaults:
      run:
        working-directory: Tests/Oberflaeche
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tests/Oberflaeche/package-lock.json
      - name: Abhängigkeiten
        run: npm ci
      - name: Playwright-Version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Browser-Cache
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium (nur Headless-Shell) herunterladen
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - name: Systembibliotheken nur nachinstallieren, wenn der Browser nicht startet
        run: |
          node --input-type=module -e "import { chromium } from '@playwright/test'; const b = await chromium.launch(); await b.close();" \
            || { echo '::notice::Browser startet nicht ohne zusätzliche Bibliotheken — install-deps'; npx playwright install-deps chromium; }
      - name: Oberflächentests (Shard ${{ matrix.shard }} von 6)
        run: npx playwright test --shard=${{ matrix.shard }}/6 --workers=2 --fully-parallel --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Bericht und Traces hochladen
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-bericht-${{ matrix.shard }}
          path: |
            Tests/Oberflaeche/playwright-report
            Tests/Oberflaeche/test-results
          retention-days: 14
          if-no-files-found: ignore

  # Ein macOS-Job (macOS-Runner sind knapp). `swift test` baut ohnehin alle Ziele (auch die App) und führt dann die Tests aus;
  # ein getrennter „swift build“ vorweg oder parallel brächte nichts (gemessen: jeder Lauf plant das Paket ≈ 15–20 s neu).
  swift:
    needs: aenderungen
    if: needs.aenderungen.outputs.swift == 'true'
    # Package.swift verlangt swift-tools 6.2 und macOS 26 -> macos-26-Image (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 20
    env:
      XCODE_VERSION: '26.6'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Xcode festlegen und Toolchain anzeigen
        id: toolchain
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "::warning::Xcode ${XCODE_VERSION} nicht auf dem Image — Standard-Xcode wird benutzt"
          fi
          sw_vers
          xcodebuild -version
          swift --version
          echo "xcode=$(xcodebuild -version | tr -s '\n ' '-')" >> "$GITHUB_OUTPUT"
      - name: SwiftPM-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # .build: Abhängigkeiten (Sparkle); ~/Library/Caches/org.swift.swiftpm: übersetzte Paket-Manifeste von SwiftPM.
          # Die Objektdateien in .build bringen kaum etwas: nach dem Checkout haben alle Quellen neue Zeitstempel, es wird neu gebaut.
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm2-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm2-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-
      - name: Build (alle Ziele) und Test
        run: swift test --parallel
      # Kern-Manifest (SHA-256 je Datei im Bundle) und Vorschau-Modus (Wegwerf-Ordner, Schutz vor echtem Benutzerordner).
      - name: Kern-Manifest
        run: bash scripts/teste-kern-manifest.sh
      - name: Vorschau-Modus
        run: bash scripts/teste-vorschau.sh

  # Plattform-Probe (Paket W0, docs/plaene/plattformen-windows-linux.md): dieselben Node-, Kern- und Oberflächentests auf Windows und Linux.
  # Linux ist ein TOR (der Job steht in `needs` von ci-ok, die Schritte laufen dort ohne continue-on-error). Windows ist MESSUNG: dort läuft jeder Schritt
  # mit continue-on-error (ausgenommen die Node-Tests: Tor), der Job bleibt grün; Zahlen und rote Tests stehen in der Zusammenfassung des Laufs (Schritt „Bericht“) und als Artefakt.
  # Sobald Windows durchgehend grün ist, entfällt die Bedingung `matrix.os == 'windows-latest'` an den drei Schritten.
  plattform-probe:
    needs: aenderungen
    if: needs.aenderungen.outputs.vorab == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        bereich: [node, kern, ui-1, ui-2, ui-3, ui-4]
    name: plattform-probe (${{ matrix.os }}, ${{ matrix.bereich }})
    env:
      PLAYWRIGHT_HTML_OPEN: never
      # Git-Identität nur für Kern und Oberfläche (wie im Haupt-Workflow, per Schritt): die Node-Tests prüfen „Identität trotz leerem HOME“ und dürfen sie nicht vorfinden.
    defaults:
      run:
        shell: bash
    steps:
      # Zeilenenden regelt `.gitattributes` (`* text=auto eol=lf`): auch der Windows-Checkout (core.autocrlf=true) bekommt LF.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.bereich != 'kern'
        with:
          node-version: '22'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.bereich == 'kern'
        with:
          node-version-file: scripts/node-version.txt
      - name: Node-Tests
        id: lauf-node
        if: matrix.bereich == 'node'
        # Die Node-Tests sind auch unter Windows ein TOR (0 rot, Paket fix/windows-rest); Kern und Oberfläche bleiben dort Messung.
        run: |
          (cd Werkzeuge/symbole && npm ci --ignore-scripts --no-audit --no-fund) || true
          bash scripts/teste-node.sh --test-concurrency=4 2>&1 | tee "$RUNNER_TEMP/lauf.log"
          exit "${PIPESTATUS[0]}"
      - name: Kern-Unit-Tests
        id: lauf-kern
        if: matrix.bereich == 'kern'
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        env:
          KERN_TEST_KONKURRENZ: 4
          GIT_AUTHOR_NAME: Test
          GIT_AUTHOR_EMAIL: t@example.org
          GIT_COMMITTER_NAME: Test
          GIT_COMMITTER_EMAIL: t@example.org
        run: |
          bash Tests/Kern/unit.sh 2>&1 | tee "$RUNNER_TEMP/lauf.log"
          exit "${PIPESTATUS[0]}"
      - name: Oberflächentests (Chromium)
        id: lauf-ui
        if: startsWith(matrix.bereich, 'ui')
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        working-directory: Tests/Oberflaeche
        timeout-minutes: 40
        env:
          BEREICH: ${{ matrix.bereich }}
          KORTEX_SERVERLOG: ${{ runner.temp }}/server.log
          GIT_AUTHOR_NAME: Test
          GIT_AUTHOR_EMAIL: t@example.org
          GIT_COMMITTER_NAME: Test
          GIT_COMMITTER_EMAIL: t@example.org
        run: |
          npm ci
          npx playwright install --only-shell chromium
          npx playwright test --shard="${BEREICH#ui-}/4" --workers=2 --fully-parallel --reporter=list 2>&1 | tee "$RUNNER_TEMP/lauf.log"
          exit "${PIPESTATUS[0]}"
      - name: Bericht
        if: always()
        run: |
          ERG="${{ steps.lauf-node.outcome }}${{ steps.lauf-kern.outcome }}${{ steps.lauf-ui.outcome }}"
          bash scripts/plattform-probe-bericht.sh "${{ matrix.os }} / ${{ matrix.bereich }}" "$RUNNER_TEMP/lauf.log" "${ERG:-übersprungen}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Log hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plattform-probe-${{ matrix.os }}-${{ matrix.bereich }}
          path: ${{ runner.temp }}/lauf.log
          retention-days: 14
          if-no-files-found: ignore
      # Ursachen roter Oberflächentests: Seitenabbild beim Fehler (error-context.md) und Ausgabe der Werkstatt (nur Windows, klein)
      - name: Fehlerkontext hochladen
        if: always() && matrix.os == 'windows-latest' && startsWith(matrix.bereich, 'ui')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plattform-probe-fehlerkontext-${{ matrix.os }}-${{ matrix.bereich }}
          path: |
            Tests/Oberflaeche/test-results/**/error-context.md
            ${{ runner.temp }}/server.log
          retention-days: 7
          if-no-files-found: ignore

  # Electron-Hülle (Paket W2a, electron/, docs/plaene/plattformen-windows-linux.md): die ECHTE App (Playwright `_electron`) mit Test-Vault, Temp-HOME und eigenem Support-Ordner.
  # Linux (xvfb) ist ein TOR (der Job steht in `needs` von ci-ok), Windows ist MESSUNG: der Test-Schritt läuft dort mit continue-on-error, der Job bleibt grün, das Ergebnis steht
  # in der Zusammenfassung des Laufs. Sobald Windows durchgehend grün ist, entfällt die Bedingung `matrix.os == 'windows-latest'`.
  electron-probe:
    needs: aenderungen
    if: needs.aenderungen.outputs.node == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: electron-probe (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Abhängigkeiten (Electron lädt seine Programmdatei beim Installieren)
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: npm ci --no-audit --no-fund
        working-directory: electron
      # Chromium-Sandbox unter Linux: der SUID-Helfer gehört root, und Ubuntu 24.04 sperrt unprivilegierte User-Namensräume. So läuft die App MIT Sandbox (kein --no-sandbox).
      - name: Sandbox-Helfer einrichten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Electron-Test
        id: lauf
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        working-directory: electron
        env:
          KORTEX_BILDER: ${{ runner.temp }}/bilder
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1440x900x24" npx playwright test 2>&1 | tee "$RUNNER_TEMP/electron.log"
          else
            npx playwright test 2>&1 | tee "$RUNNER_TEMP/electron.log"
          fi
          exit "${PIPESTATUS[0]}"
      - name: Bericht
        if: always()
        run: |
          {
            echo "### electron-probe (${{ matrix.os }}): ${{ steps.lauf.outcome }}"
            echo '```'
            grep -E "^\s+(✓|✘|-|[0-9]+ (passed|failed|skipped))|passed|failed|Error:" "$RUNNER_TEMP/electron.log" | head -n 60 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fenster-Foto und Bericht hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: electron-probe-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/bilder
            ${{ runner.temp }}/electron.log
            electron/test-results
          retention-days: 14
          if-no-files-found: ignore

  # Pakete der Electron-Hülle (Paket W2c, electron/paket, docs/plaene/plattformen-windows-linux.md §11): electron-builder baut NSIS (Windows) bzw. AppImage + deb (Linux) mit dem
  # mitgelieferten Node; hochgeladen wird NUR als Artefakt dieses Laufs (kein Release, kein Tag). Rauchtest je System: das gebaute Paket wird installiert bzw. entpackt und gestartet
  # (electron/test/paket.spec.mjs: die Werkstatt läuft mit dem mitgelieferten Node, MCP-Eintrag auf stabilen Pfaden), danach wieder deinstalliert.
  # Linux UND Windows sind TOR (der Job steht in `needs` von ci-ok; ein roter Windows-Schritt macht ci-ok rot). Nur der arm64-Bau ist Messung. Gebaut werden zwei Varianten: Release (Artefakt, Fuses der
  # Auslieferung, geprüft mit @electron/fuses und einem Start ohne Playwright) und Test (nur Inspect offen für Playwright; nie hochgeladen).
  paket:
    needs: aenderungen
    if: needs.aenderungen.outputs.paket == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: paket (${{ matrix.os }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Abhängigkeiten
        run: npm ci --no-audit --no-fund
        working-directory: electron
      - name: Paket bauen (Node mit Prüfsumme, Ressourcen, electron-builder; nichts wird veröffentlicht)
        id: bau
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Release-Variante (wird ausgeliefert, Artefakt) und Test-Variante (nur Inspect offen, für Playwright; nie hochgeladen)
          if [ "$RUNNER_OS" = "Linux" ]; then S=linux; else S=win; fi
          npm run paket -- "$S"
          npm run paket -- "$S" --fuses test --ausgabe pakete-test
          ls -la build/pakete build/pakete-test
      - name: Fuses der Release-Variante prüfen und ohne Playwright starten
        working-directory: electron
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then APP="$PWD/build/pakete/linux-unpacked/kortex"; else APP="$PWD/build/pakete/win-unpacked/kortex.exe"; fi
          node paket/pruefe-fuses.mjs "$APP" release
          # die Test-Variante muss sich unterscheiden (nur Inspect), sonst prüft der Test nichts
          if [ "$RUNNER_OS" = "Linux" ]; then node paket/pruefe-fuses.mjs "$PWD/build/pakete-test/linux-unpacked/kortex" test; else node paket/pruefe-fuses.mjs "$PWD/build/pakete-test/win-unpacked/kortex.exe" test; fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            xvfb-run -a --server-args="-screen 0 1440x900x24" node paket/start-pruefung.mjs "$APP" --no-sandbox
          else
            node paket/start-pruefung.mjs "$APP"
          fi
      - name: Linux arm64 bauen (nur Bau, Messung)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm run paket -- linux --arch arm64 --ausgabe pakete-arm64
          ls -la build/pakete-arm64
          file build/node/linux-arm64/node
      - name: Pakete als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pakete-${{ matrix.os }}
          path: |
            electron/build/pakete/*.AppImage
            electron/build/pakete/*.deb
            electron/build/pakete/*.exe
            electron/build/pakete/latest*.yml
            electron/build/pakete-arm64/*.AppImage
            electron/build/pakete-arm64/*.deb
            electron/build/pakete-arm64/latest*.yml
          retention-days: 14
          if-no-files-found: warn
      - name: Größen
        if: always()
        run: |
          {
            echo "### Pakete (${{ matrix.os }}): Bau ${{ steps.bau.outcome }}"
            echo '```'
            ls -la electron/build/pakete electron/build/pakete-arm64 2>/dev/null | grep -E "AppImage|\.deb|\.exe|latest" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # ───── Linux: AppImage (entpackt und als echtes AppImage mit anderem Pfad) und deb (wirklich installiert, mit SUID-Sandbox) ─────
      - name: Rauchtest AppImage (entpackte Kopie und AppImage selbst — zwei verschiedene Pfade)
        if: runner.os == 'Linux'
        working-directory: electron
        env:
          KORTEX_TEST_OHNE_SANDBOX: '1'
          KORTEX_BILDER: ${{ runner.temp }}/bilder
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          A="$(ls "$PWD"/build/pakete-test/*.AppImage)"
          chmod +x "$A"
          mkdir -p "$RUNNER_TEMP/a1" && (cd "$RUNNER_TEMP/a1" && "$A" --appimage-extract >/dev/null)
          export KORTEX_PAKET_PROGRAMM="$RUNNER_TEMP/a1/squashfs-root/kortex"
          export KORTEX_PAKET_PROGRAMM2="$A"
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a --server-args="-screen 0 1440x900x24" npx playwright test test/paket.spec.mjs test/vorschau.spec.mjs 2>&1 | tee "$RUNNER_TEMP/paket-appimage.log"
          exit "${PIPESTATUS[0]}"
      - name: Rauchtest deb (installieren, starten, deinstallieren)
        if: runner.os == 'Linux'
        working-directory: electron
        run: |
          set -euo pipefail
          D="$(ls "$PWD"/build/pakete-test/*.deb)"
          NAME="$(dpkg-deb -f "$D" Package)"
          # Ubuntu-Auslieferungszustand: unprivilegierte User-Namensräume gesperrt — die Installation muss den Sandbox-Helfer selbst einrichten (SUID, wenn es nicht anders geht)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1 || true
          sudo apt-get install -y "$D"
          test -x /opt/Kortex/kortex
          stat -c 'chrome-sandbox: %a %U' /opt/Kortex/chrome-sandbox
          export KORTEX_PAKET_PROGRAMM=/opt/Kortex/kortex
          unset KORTEX_TEST_OHNE_SANDBOX
          set +e
          xvfb-run -a --server-args="-screen 0 1440x900x24" npx playwright test test/paket.spec.mjs 2>&1 | tee "$RUNNER_TEMP/paket-deb.log"
          R="${PIPESTATUS[0]}"
          set -e
          sudo apt-get remove -y "$NAME"
          if [ -e /opt/Kortex ]; then echo "::error::/opt/Kortex ist nach der Deinstallation noch da"; ls -la /opt/Kortex; R=1; fi
          exit "$R"
      # ───── Windows: NSIS still pro Benutzer installieren, starten, still deinstallieren ─────
      - name: Rauchtest Windows (installieren, starten, deinstallieren)
        id: win
        if: runner.os == 'Windows'
        timeout-minutes: 20
        working-directory: electron
        shell: pwsh
        env:
          KORTEX_BILDER: ${{ runner.temp }}/bilder
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem build/pakete-test/Kortex-Setup-*.exe | Select-Object -First 1).FullName
          Write-Host "Installer: $setup ($([math]::Round((Get-Item $setup).Length / 1MB)) MB)"
          $ziel = Join-Path $env:LOCALAPPDATA 'Programs\Kortex'
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          Get-Process -Name kortex, Kortex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $ziel)) {
            Write-Host "Inhalt von $env:LOCALAPPDATA\Programs und der Uninstall-Einträge:"
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | Format-Table Name | Out-String | Write-Host
            Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -match 'Kortex|kortex' } | Format-List DisplayName, InstallLocation | Out-String | Write-Host
            throw "Nicht installiert unter $ziel (pro Benutzer, ohne Admin)"
          }
          Get-ChildItem $ziel | Select-Object -First 20 Name | Format-Table | Out-String | Write-Host
          $exe = (Get-ChildItem $ziel -Filter *.exe | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1).FullName
          Write-Host "Programm: $exe"
          $env:KORTEX_PAKET_PROGRAMM = $exe
          $fehler = $null
          npx playwright test test/paket.spec.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/paket-windows.log"
          if ($LASTEXITCODE -ne 0) { $fehler = "Rauchtest rot ($LASTEXITCODE)" }
          Get-Process -Name kortex, Kortex -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninst = Join-Path $ziel 'Uninstall Kortex.exe'
          if (-not (Test-Path $uninst)) { throw "Deinstallationsprogramm fehlt: $uninst" }
          Start-Process -FilePath $uninst -ArgumentList "/S _?=$ziel" -Wait
          if (Test-Path (Join-Path $ziel 'resources')) { throw 'Nach der Deinstallation liegen noch Programmdateien da' }
          if ($fehler) { throw $fehler }
          'WINDOWS-RAUCHTEST OK: installiert, gestartet, Werkstatt mit mitgeliefertem Node, deinstalliert' | Tee-Object -FilePath "$env:RUNNER_TEMP/paket-windows.log" -Append
      - name: Bericht
        if: always()
        run: |
          {
            echo "### Rauchtest (${{ matrix.os }})"
            for l in paket-appimage paket-deb paket-windows; do
              f="$RUNNER_TEMP/$l.log"
              [ -f "$f" ] || continue
              echo "**$l**"
              echo '```'
              grep -E "^\s+(✓|✘|ok|-|[0-9]+ (passed|failed|skipped))|passed|failed|Error:|Kinder:|WINDOWS-RAUCHTEST" "$f" | head -n 30 || true
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Logs hochladen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paket-bericht-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/paket-*.log
            electron/test-results
          retention-days: 14
          if-no-files-found: ignore

  # EIN Status für den ganzen Lauf. Grün, wenn jeder Job erfolgreich war oder übersprungen wurde (weil sein Bereich unverändert
  # ist); rot bei Fehlschlag oder Abbruch. Läuft immer (if: always()), auch wenn davor etwas rot ist.
  ci-ok:
    if: always()
    needs: [aenderungen, vorpruefung, kern-test, node-test, ui-test, swift, plattform-probe, electron-probe, paket]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ergebnis aller Jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null; then
            echo "CI grün."
          else
            echo "::error::Mindestens ein Job ist fehlgeschlagen oder abgebrochen."
            exit 1
          fi

  # Spur „dev“: jeder Stand von main als Kortex.app (ad-hoc signiert), 14 Tage abrufbar. Erst, wenn alles grün ist.
  dev-artefakt:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.aenderungen.outputs.vorab == 'true'
    needs: [aenderungen, ci-ok]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain anzeigen
        id: toolchain
        run: |
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | tr -s '\n ' '-')" >> "$GITHUB_OUTPUT"
      - name: SwiftPM-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ steps.toolchain.outputs.xcode }}-
      - name: App bauen (Node mit Prüfsumme)
        run: bash scripts/baue-app.sh
      - name: Zippen
        run: ditto -c -k --keepParent build/Kortex.app "Kortex-dev-${GITHUB_SHA::7}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Kortex-dev-${{ github.sha }}
          path: Kortex-dev-*.zip
          retention-days: 14
          if-no-files-found: error
