<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Brain</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div id="app" data-info="an">
  <aside id="seite" aria-label="Seitenleiste">
    <header class="seite-kopf">
      <div class="vault"><span class="vault-zeichen" aria-hidden="true"></span><span id="vault-name" class="vault-name">Brain</span></div>
      <button id="knopf-neu" class="knopf-icon" title="Neue Notiz (⌘N)" aria-label="Neue Notiz">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>
    <div class="suche-feld">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="suche" type="search" autocomplete="off" spellcheck="false" aria-label="Suchen">
      <kbd class="tipp">⌘⇧F</kbd>
    </div>
    <nav id="bereiche" class="bereiche" aria-label="Bereiche"></nav>
    <div id="baum" class="baum" role="tree"></div>
    <footer class="seite-fuss">
      <button id="fuss-neu" class="knopf-fuss"><span class="plus">+</span><span data-t="neu">Neu</span></button>
      <button id="fuss-merken" class="knopf-fuss"><span class="blitz">✦</span><span data-t="merken">Schnell merken</span></button>
    </footer>
  </aside>

  <main id="haupt">
    <header class="werkzeug">
      <div id="pfad" class="pfad"></div>
      <div class="werkzeug-rechts">
        <span id="pille" class="pille" hidden></span>
        <span id="speicherstand" class="speicherstand" aria-live="polite"></span>
        <button id="knopf-info" class="knopf-icon" title="Infospalte (⌘⌥I)" aria-label="Infospalte" aria-pressed="true">
          <svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M10 3.5v9" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
      </div>
    </header>
    <div id="kit-host"></div>
    <div id="banner-host"></div>
    <div id="editor"></div>
    <section id="leer" class="leer" hidden></section>
  </main>

  <aside id="info" aria-label="Infospalte"></aside>

  <footer id="status" class="status" role="status"></footer>
</div>
<div id="dialog-host"></div>
<div id="toast-host" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
