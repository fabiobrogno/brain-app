<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kortex</title>
<script src="fehlerhaken.js"></script>
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="verlauf.css">
<link rel="stylesheet" href="willkommen.css">
<link rel="stylesheet" href="vertrauen.css">
<link rel="stylesheet" href="aufgaben.css">
<link rel="stylesheet" href="frage.css">
<link rel="stylesheet" href="live.css">
<link rel="stylesheet" href="bausteine.css">
<link rel="stylesheet" href="dialoge.css">
<link rel="stylesheet" href="hauptfenster.css">
</head>
<body>
<div id="app" data-info="an" data-modus="liste">
  <aside id="seite" aria-label="Seitenleiste">
    <header class="seite-kopf">
      <button id="vault-wechsler" class="vault-knopf" aria-haspopup="menu" aria-expanded="false" title="Vault wechseln">
        <span id="vault-farbe" class="vault-farbe" aria-hidden="true"></span>
        <span id="vault-name" class="vault-name">Kortex</span>
        <span id="vault-pfeil" class="vault-pfeil" aria-hidden="true"></span>
      </button>
    </header>
    <div class="erfassen">
      <button id="fuss-merken" class="erfassen-feld" type="button"><span data-sym="blitz"></span><span class="erfassen-text" data-t="merken">Schnell erfassen</span><kbd class="erfassen-taste"><span aria-hidden="true">⌥</span> Leer</kbd></button>
      <button id="fuss-neu" class="erfassen-neu" type="button"><span data-sym="stift"></span></button>
    </div>
    <div id="seite-scroll" class="seite-scroll">
      <nav id="bereiche" class="gruppe" aria-label="Bereiche"></nav>
      <section class="abschnitt" id="favoriten-abschnitt" data-abschnitt="favoriten" hidden></section>
      <section class="abschnitt" data-abschnitt="ordner"></section>
      <section class="abschnitt" data-abschnitt="sichten"></section>
      <section class="abschnitt" data-abschnitt="ansichten"></section>
      <section class="abschnitt" data-abschnitt="typen"></section>
    </div>
    <footer class="seite-fuss">
      <button id="ki-zeile" class="ki-zeile" type="button" aria-haspopup="false" hidden></button>
    </footer>
  </aside>

  <header id="kopf" class="kopf" aria-label="Kopfzeile">
    <div class="kopf-links">
      <button id="au-zurueck" class="knopf-text au-zurueck" type="button" data-aktion="aufgaben-zurueck"></button>
      <div id="pfad" class="pfad" aria-label="Pfad der Notiz"></div>
    </div>
    <button id="kopf-suche" class="kopf-suche" type="button" aria-haspopup="dialog" aria-keyshortcuts="Meta+K">
      <span data-sym="suche"></span><span class="kopf-suche-text" data-t="kopfSuche">Suchen oder Befehl …</span><span class="kopf-suche-tasten" aria-hidden="true"><kbd>⌘</kbd><kbd>K</kbd></span>
    </button>
    <div class="kopf-rechts">
      <span id="pille" class="pille" hidden></span>
      <span id="speicherstand" class="speicherstand" aria-live="polite"></span>
      <div id="werkzeuge" class="werkzeuge" role="toolbar" aria-label="Werkzeuge der Notiz"></div>
      <button id="knopf-verlauf" class="knopf-icon" type="button" aria-pressed="false"></button>
      <button id="knopf-info" class="knopf-icon" type="button" aria-pressed="false" aria-keyshortcuts="Meta+Backslash"></button>
      <button id="knopf-frage" class="knopf-frag" type="button" title="Frag deinen Vault (⌘J)" aria-label="Frag deinen Vault" aria-keyshortcuts="Meta+J" aria-pressed="false"><span data-sym="funke"></span><span class="knopf-frag-text">Frag</span></button>
    </div>
  </header>

  <section id="liste" aria-label="Notizen">
    <header class="liste-kopf">
      <h2 id="liste-titel" class="liste-titel"></h2>
      <div class="liste-werkzeuge">
        <button id="knopf-sort" class="knopf-text" aria-haspopup="menu" aria-expanded="false" title="Sortierung"></button>
        <button id="knopf-suche" class="knopf-icon" title="Im Vault suchen (⌘⇧F)" aria-label="Im Vault suchen"></button>
        <button id="knopf-neu" class="knopf-icon" title="Neue Notiz (⌘N)" aria-label="Neue Notiz"></button>
      </div>
    </header>
    <div id="liste-suche" class="liste-suche" hidden>
      <div class="bs-feld bs-s">
        <span data-sym="suche" class="bs-feld-symbol"></span>
        <input id="suche" class="bs-input" type="search" autocomplete="off" spellcheck="false" aria-label="Suchen">
        <button id="suche-zu" class="knopf-icon klein" aria-label="Suche schließen"></button>
      </div>
    </div>
    <div id="liste-koerper" class="liste-koerper" tabindex="0" role="listbox" aria-label="Notizen"></div>
  </section>

  <main id="haupt">
    <div id="umstellung-host"></div>
    <div id="banner-host"></div>
    <div id="aufgaben-host"></div>
    <div id="editor"></div>
    <section id="leer" class="leer" hidden></section>
    <section id="diff-host" class="diff-host" hidden aria-label="Änderung"></section>
  </main>

  <aside id="info" aria-label="Eigenschaften"></aside>
  <div id="frage-host"></div>

  <footer id="status" class="status" aria-label="Statusleiste"></footer>
  <div id="status-ansage" class="kein-ansage" role="status" aria-live="polite"></div>

  <div class="griff" data-griff="seite" role="separator" aria-orientation="vertical" aria-label="Breite der Seitenleiste" tabindex="0"></div>
  <div class="griff" data-griff="liste" role="separator" aria-orientation="vertical" aria-label="Breite der Notizliste" tabindex="0"></div>
  <div class="griff" data-griff="info" role="separator" aria-orientation="vertical" aria-label="Breite der Eigenschaften" tabindex="0"></div>
</div>
<div id="willkommen-host" hidden></div>
<div id="einstellungen-host" hidden></div>
<div id="dialog-host"></div>
<div id="menue-host"></div>
<div id="toast-host" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
